[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quotepulse-backend"
version = "0.1.0"
description = "QuotePulse — AI-native CRM for industrial sales workflows backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "email-validator>=2.2",
  "python-dotenv>=1.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/atal-k/quotepulse"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["app/core"]
ignore_missing_imports = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
